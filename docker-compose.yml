services:
  lunatv-redis:
    image: redis:alpine
    container_name: lunatv-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - lunatv-network

  lunatv-app:
    image: ghcr.io/moontechlab/lunatv:latest
    container_name: lunatv-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - USERNAME=admin
      - PASSWORD=admin_password
      - NEXT_PUBLIC_STORAGE_TYPE=redis
      - REDIS_URL=redis://lunatv-redis:6379
      - NEXT_PUBLIC_DOUBAN_PROXY_TYPE=direct
      - NEXT_PUBLIC_DOUBAN_IMAGE_PROXY_TYPE=direct
    depends_on:
      - lunatv-redis
    networks:
      - lunatv-network

networks:
  lunatv-network:
    driver: bridge

volumes:
  redis-data:
